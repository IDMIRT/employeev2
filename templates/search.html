{% extends "base.html" %}

{% block title %}Поиск сотрудников{% endblock %}

{% block styles %}
<style>
    .btn {
        display: inline-block;
        padding: 8px 16px;
        text-decoration: none;
        border-radius: 4px;
        border: none;
        cursor: pointer;
        font-size: 1rem;
        transition: background-color 0.2s ease;
    }

    .btn-primary {
        background-color: #2ecc71;
        color: white;
    }

    .btn-primary:hover {
        background-color: #27ae60;
    }

    .btn-secondary {
        background-color: #95a5a6;
        color: white;
    }

    .btn-secondary:hover {
        background-color: #7f8c8d;
    }
</style>
{% endblock %}

{% block content %}
<h2>Поиск сотрудников</h2>

<form method="GET" action="{{ url_for('employees') }}">
    <div style="margin-bottom: 15px;">
        <label for="query"><strong>Введите имя или часть имени:</strong></label><br>
        <input type="text" id="query" name="str_search" value="{{ search_query }}" style="width: 300px; padding: 8px;" autofocus required>
    </div>
    
    <button type="submit" class="btn btn-primary">Искать</button>
    <a href="{{ url_for('employees') }}" class="btn btn-secondary" style="margin-left: 10px;">Отмена / Весь список</a>
</form>
{% endblock %}
