<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Мое Flask Приложение{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Стили навигационной панели -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding-top: 60px; /* Отступ сверху, чтобы контент не заезжал под фиксированную панель */
            box-sizing: border-box;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #2c3e50;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            color: #fff;
            text-decoration: none;
            font-size: 1.4rem;
            font-weight: bold;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            gap: 30px;
            margin: 0;
            padding: 0;
        }

        .nav-menu li a {
            color: #ecf0f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-menu li a:hover {
            color: #3498db;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
    </style>
</head>
<body>

<!-- Навигационная панель вынесена сюда -->
<header class="navbar">
    <a href="/" class="logo">Управление сотрудниками</a>
    <nav>
        <ul class="nav-menu">
            <li><a href="#">Сотрудники</a></li>
            <li><a href="#">Подразделения</a></li>
            <li><a href="#">Поиск</a></li>
            <!-- <li><a href="#">Войти</a></li> -->
        </ul>
    </nav>
</header>

<!-- Блок для контента дочерних страниц -->
<main class="container">
    {% block content %}
    <!-- Этот блок будет заменен содержимым index.html -->
    {% endblock %}
</main>

</body>
</html>
