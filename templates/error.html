{% extends "base.html" %}

{% block styles %}
<style>
    /* Контейнер сообщения об ошибке */
    .alert-error {
        background-color: #fee;          
        color: #900;                     
        padding: 15px;
        border-left: 5px solid #d9534f; 
        margin-bottom: 20px;
        font-family: Arial, sans-serif;
    }

    .alert-error strong {
        display: block;
        margin-bottom: 5px;
        font-size: 1.1em;
    }

    .alert-details {
        white-space: pre-wrap;           
        font-size: 0.9em;
        margin-top: 10px;
        font-family: Consolas, monospace;
        background-color: rgba(0,0,0,0.05); 
        padding: 10px;
        border-radius: 4px;
    }
</style>
{% endblock %}


{% block content %}
<h1>Ошибка приложения</h1>
<p>Страница ошибки</p>

<div class="alert-error">
    <strong>{{ name_error | default("Неизвестная ошибка") }}</strong>
    
    {% if details %} 
        <div class="alert-details">{{ details }}</div> 
    {% endif %} 
</div>
{% endblock %}
