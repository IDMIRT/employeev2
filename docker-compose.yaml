version: '3.8'
services:
  db:
    image: postgres:18 
    container_name: iline_employee
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 7486250
      POSTGRES_DB: employee
    volumes:
      - type: bind
        source: ./data 
        target: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5